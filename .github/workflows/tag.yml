name: Create Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SDK version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          SDK_VERSION=$(sed -n 's/^public let SDK_VERSION = "\(.*\)"/\1/p' Sources/KovaleeSDK/Kovalee.swift)
          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match SDK_VERSION ($SDK_VERSION) in Sources/KovaleeSDK/Kovalee.swift"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: "true"
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
          token: ${{ github.token }}
